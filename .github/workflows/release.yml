# Builds signed installers for a version tag (git tag v0.2.0 && git push --tags)
# and publishes them as a GitHub release together with latest.json, which the
# in-app updater reads. Make a key pair once with `cargo tauri signer generate`, then
# set the TAURI_UPDATER_PUBKEY repository variable to the public key and the
# TAURI_SIGNING_PRIVATE_KEY secret (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the
# key has one) to the private key. The public key goes into the build from here,
# so tauri.conf.json carries none and local builds don't self-update.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libpulse-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Updater key
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$PUBKEY" ]; then
            echo "::error::Set the TAURI_UPDATER_PUBKEY repository variable (cargo tauri signer generate)"
            exit 1
          fi
          printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s"}}}' "$PUBKEY" \
            > src-tauri/release.conf.json

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: Clawd ${{ github.ref_name }}
          releaseDraft: false
          includeUpdaterJson: true
          args: --config ${{ github.workspace }}/src-tauri/release.conf.json
